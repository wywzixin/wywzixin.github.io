<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="3D AI avatar">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7eb3ff"/>
      <stop offset="100%" stop-color="#2366d1"/>
    </linearGradient>
    <radialGradient id="face" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef3fb"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2366d1" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#ring)"/>
  <circle cx="256" cy="256" r="220" fill="url(#face)"/>

  <!-- AI nodes -->
  <g fill="#609dff" opacity="0.9">
    <circle cx="118" cy="168" r="6"/>
    <circle cx="96" cy="248" r="4.5"/>
    <circle cx="128" cy="332" r="5.5"/>
    <circle cx="394" cy="164" r="5.5"/>
    <circle cx="416" cy="248" r="4.5"/>
    <circle cx="386" cy="336" r="6"/>
  </g>
  <g stroke="#609dff" stroke-width="1.6" fill="none" opacity="0.45">
    <path d="M118 168 L96 248 L128 332"/>
    <path d="M394 164 L416 248 L386 336"/>
    <path d="M118 168 L186 214"/>
    <path d="M394 164 L326 214"/>
    <path d="M128 332 L186 298"/>
    <path d="M386 336 L326 298"/>
  </g>

  <!-- stacked isometric cubes, same palette as Icarus logo -->
  <g transform="translate(256 262) scale(0.92)" filter="url(#soft)">
    <g transform="translate(-111 -128)">
      <path fill="#2366d1" d="M110.85 128 L221.7 192 L110.85 256 L0 192 Z"/>
      <path fill="#609dff" d="M110.85 64 L221.7 128 L110.85 192 L0 128 Z"/>
      <path fill="#a4c7ff" d="M110.85 0 L221.7 64 L110.85 128 L0 64 Z"/>
    </g>
  </g>
</svg>
